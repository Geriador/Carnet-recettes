<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Carnet — recettes glanées</title>
<meta name="theme-color" content="#181C19">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --nuit:#181C19; --ardoise:#222723; --ardoise-h:#2C322D; --trait:#38403A;
  --encre:#EFEBE1; --encre-douce:#9AA69C; --safran:#F2A93B; --basilic:#7FB07F; --brulure:#D2603A;
  --r:14px; --sp:16px;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Karla",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--nuit);color:var(--encre);font-family:var(--sans);font-size:16px;line-height:1.5;
  overflow-x:hidden;-webkit-tap-highlight-color:transparent}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--safran);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- ossature ---------- */
.enveloppe{max-width:1100px;margin:0 auto;padding:0 var(--sp) 120px}
header.tete{padding:22px 0 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.marque{font-family:var(--serif);font-weight:800;font-size:clamp(26px,7vw,38px);line-height:1;letter-spacing:-.02em;margin:0}
.marque span{display:block;font-family:var(--sans);font-weight:500;font-size:13px;letter-spacing:.01em;
  color:var(--encre-douce);margin-top:6px}
.compteur{font-family:var(--serif);font-size:13px;color:var(--encre-douce);text-align:right;white-space:nowrap}
.compteur b{display:block;font-size:26px;color:var(--safran);font-weight:600;line-height:1}

.cherche{position:relative;margin:14px 0 6px}
.cherche input{width:100%;padding:13px 14px 13px 42px;background:var(--ardoise);border:1px solid var(--trait);
  border-radius:var(--r);color:var(--encre)}
.cherche input::placeholder{color:var(--encre-douce)}
.cherche svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--encre-douce);fill:none;stroke-width:2}

nav.onglets{display:flex;gap:4px;margin:14px 0 4px;border-bottom:1px solid var(--trait)}
nav.onglets button{padding:10px 12px;font-weight:500;color:var(--encre-douce);border-bottom:2px solid transparent;
  margin-bottom:-1px;display:flex;align-items:center;gap:7px}
nav.onglets button[aria-selected="true"]{color:var(--encre);border-bottom-color:var(--safran)}
.pastille{background:var(--safran);color:#20160A;font-size:11px;font-weight:700;border-radius:999px;padding:1px 6px;min-width:18px;text-align:center}
.pastille[hidden]{display:none}

/* ---------- filtres ---------- */
.filtres{display:flex;gap:8px;overflow-x:auto;padding:14px 0 6px;scrollbar-width:none}
.filtres::-webkit-scrollbar{display:none}
.puce{flex:0 0 auto;padding:7px 13px;border:1px solid var(--trait);border-radius:999px;color:var(--encre-douce);
  font-size:14px;white-space:nowrap;transition:background .15s,color .15s}
.puce[aria-pressed="true"]{background:var(--safran);border-color:var(--safran);color:#20160A;font-weight:700}
.rangee-tri{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 0 12px;font-size:14px;color:var(--encre-douce)}
.rangee-tri select{background:var(--ardoise);border:1px solid var(--trait);border-radius:10px;padding:7px 10px}

/* ---------- grille ---------- */
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:14px}
.fiche{background:var(--ardoise);border-radius:var(--r);overflow:hidden;text-align:left;display:flex;flex-direction:column;
  border:1px solid var(--trait);transition:transform .12s}
.fiche:active{transform:scale(.985)}
.vignette{aspect-ratio:1;background:var(--ardoise-h);position:relative;display:grid;place-items:center;overflow:hidden}
.vignette img{width:100%;height:100%;object-fit:cover}
.vignette .vide{font-family:var(--serif);font-size:34px;color:var(--trait)}
.vignette .kcal{position:absolute;left:8px;bottom:8px;background:rgba(10,12,10,.78);backdrop-filter:blur(4px);
  border-radius:8px;padding:3px 7px;font-size:12px;font-weight:700}
.vignette .coche{position:absolute;right:8px;top:8px;width:24px;height:24px;border-radius:999px;background:var(--basilic);
  color:#0E1A0E;display:grid;place-items:center;font-size:13px;font-weight:700}
.corps-fiche{padding:10px 11px 12px}
.corps-fiche h3{font-family:var(--serif);font-size:16px;font-weight:600;line-height:1.2;margin:0 0 6px}
.meta{font-size:12.5px;color:var(--encre-douce);display:flex;flex-wrap:wrap;gap:4px 10px}

/* ---------- boîte de réception ---------- */
.attente{display:flex;gap:12px;align-items:center;background:var(--ardoise);border:1px solid var(--trait);
  border-left:3px solid var(--safran);border-radius:12px;padding:12px;margin-bottom:10px;width:100%;text-align:left}
.attente .lien{font-size:13px;color:var(--encre-douce);word-break:break-all;line-height:1.35}
.attente .titre{font-family:var(--serif);font-size:15px;font-weight:600;margin-bottom:3px}
.attente img{width:52px;height:52px;border-radius:9px;object-fit:cover;flex:0 0 auto}

.vide-etat{text-align:center;padding:54px 18px;color:var(--encre-douce)}
.vide-etat p{max-width:36ch;margin:0 auto 18px;font-size:15px}
.vide-etat .glyphe{font-family:var(--serif);font-size:56px;color:var(--trait);line-height:1}

/* ---------- boutons ---------- */
.bouton{background:var(--safran);color:#20160A;font-weight:700;padding:12px 18px;border-radius:12px;display:inline-flex;
  align-items:center;gap:8px;justify-content:center}
.bouton.fantome{background:transparent;border:1px solid var(--trait);color:var(--encre);font-weight:500}
.bouton.danger{background:transparent;border:1px solid var(--brulure);color:var(--brulure);font-weight:500}
.bouton:disabled{opacity:.45}
.fab{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;
  background:var(--safran);color:#20160A;font-weight:700;border-radius:999px;padding:15px 20px;
  box-shadow:0 8px 26px rgba(0,0,0,.45);display:flex;align-items:center;gap:8px}

/* ---------- panneaux ---------- */
.panneau{position:fixed;inset:0;z-index:60;background:var(--nuit);overflow-y:auto;
  padding:env(safe-area-inset-top,0px) 0 calc(30px + env(safe-area-inset-bottom,0px));
  animation:monte .18s ease-out}
@keyframes monte{from{transform:translateY(14px);opacity:.4}to{transform:none;opacity:1}}
.panneau[hidden],#cuisine[hidden],#panneau-ajout[hidden],#panneau-recette[hidden]{display:none!important}
#panneau-ajout{z-index:70}
#cuisine{z-index:80}
.barre-panneau{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 16px;background:rgba(24,28,25,.93);backdrop-filter:blur(8px);border-bottom:1px solid var(--trait)}
.barre-panneau h2{font-family:var(--serif);font-size:17px;font-weight:600;margin:0;flex:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ferme{width:36px;height:36px;border-radius:999px;background:var(--ardoise);display:grid;place-items:center;font-size:19px;flex:0 0 auto}
.dedans{max-width:760px;margin:0 auto;padding:0 16px}

/* ---------- fiche recette ---------- */
.illus{width:100%;max-height:46vh;aspect-ratio:4/3;object-fit:cover;background:var(--ardoise)}
.bande-captures{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.bande-captures::-webkit-scrollbar{display:none}
.bande-captures button{flex:0 0 auto;width:76px;height:76px;border-radius:10px;overflow:hidden;
  border:1px solid var(--trait);background:var(--ardoise-h);display:grid;place-items:center}
.bande-captures button[aria-pressed="true"]{border-color:var(--safran);box-shadow:0 0 0 2px var(--safran)}
.bande-captures img{width:100%;height:100%;object-fit:cover}
.titre-recette{font-family:var(--serif);font-size:clamp(24px,6.4vw,34px);font-weight:800;line-height:1.08;
  letter-spacing:-.02em;margin:18px 0 8px}
.chapeau{color:var(--encre-douce);font-size:15px;margin:0 0 16px;max-width:62ch}
.etiquettes{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.etq{font-size:12.5px;padding:4px 10px;border-radius:999px;background:var(--ardoise-h);color:var(--encre-douce)}
.etq.actif{background:var(--safran);color:#20160A;font-weight:700}

.bandeau-nutri{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--trait);
  border:1px solid var(--trait);border-radius:12px;overflow:hidden;margin:6px 0 10px}
.bandeau-nutri div{background:var(--ardoise);padding:11px 8px;text-align:center}
.bandeau-nutri .v{font-family:var(--serif);font-size:19px;font-weight:600;color:var(--safran);line-height:1.1}
.bandeau-nutri .l{font-size:11px;color:var(--encre-douce);margin-top:3px}
.detail-nutri{width:100%;font-size:13.5px;color:var(--encre-douce);border-collapse:collapse;margin-bottom:6px}
.detail-nutri td{padding:5px 0;border-bottom:1px solid var(--trait)}
.detail-nutri td:last-child{text-align:right;color:var(--encre)}
.fiabilite{font-size:12.5px;color:var(--encre-douce);margin:0 0 22px}

.rubrique{font-family:var(--serif);font-size:20px;font-weight:600;margin:26px 0 12px;
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.molette{display:flex;align-items:center;gap:0;background:var(--ardoise);border:1px solid var(--trait);border-radius:999px}
.molette button{width:34px;height:34px;display:grid;place-items:center;font-size:18px;color:var(--safran)}
.molette span{font-family:var(--sans);font-size:14px;font-weight:700;min-width:74px;text-align:center}
ul.ingredients{list-style:none;margin:0;padding:0}
ul.ingredients li{display:flex;gap:12px;padding:10px 2px;border-bottom:1px solid var(--trait);align-items:baseline}
ul.ingredients .q{font-family:var(--serif);font-weight:600;color:var(--safran);min-width:74px;flex:0 0 auto;font-size:15px}
ul.ingredients .n{flex:1}
ul.ingredients .inconnu{font-size:11px;color:var(--brulure);margin-left:6px}
ol.etapes{list-style:none;counter-reset:e;margin:0;padding:0}
ol.etapes li{counter-increment:e;display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--trait)}
ol.etapes li::before{content:counter(e);font-family:var(--serif);font-size:15px;font-weight:600;color:var(--safran);
  flex:0 0 auto;width:26px;height:26px;border:1px solid var(--trait);border-radius:999px;display:grid;place-items:center}
ol.etapes p{margin:0;flex:1;max-width:62ch}
.minuteur{margin-top:7px;font-size:13px;color:var(--safran);border:1px solid var(--trait);border-radius:999px;padding:3px 10px;display:inline-block}

.journal{background:var(--ardoise);border:1px solid var(--trait);border-radius:var(--r);padding:16px;margin:26px 0}
.etoiles{display:flex;gap:4px;margin:8px 0 14px}
.etoiles button{font-size:25px;color:var(--trait);line-height:1}
.etoiles button.on{color:var(--safran)}
.journal textarea{width:100%;background:var(--nuit);border:1px solid var(--trait);border-radius:10px;padding:11px;min-height:76px;resize:vertical}
.rangee-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.source{font-size:13px;color:var(--encre-douce);margin:22px 0;word-break:break-all}
.source a{color:var(--safran)}

/* ---------- ajout ---------- */
.zone{width:100%;background:var(--ardoise);border:1px solid var(--trait);border-radius:12px;padding:13px;
  min-height:190px;resize:vertical;font-size:15px;line-height:1.5}
.aide{font-size:13.5px;color:var(--encre-douce);margin:10px 0 16px;max-width:62ch}
.choix-fichier{display:block;border:1px dashed var(--trait);border-radius:12px;padding:18px;text-align:center;
  color:var(--encre-douce);margin:12px 0;cursor:pointer}
.champ{display:block;margin-bottom:14px}
.champ span{display:block;font-size:13px;color:var(--encre-douce);margin-bottom:5px}
.champ input,.champ select,.champ textarea{width:100%;background:var(--ardoise);border:1px solid var(--trait);
  border-radius:10px;padding:11px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ---------- courses / semaine ---------- */
.rayon{font-family:var(--serif);font-size:17px;font-weight:600;color:var(--safran);margin:22px 0 8px}
.ligne-course{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--trait)}
.ligne-course input{width:20px;height:20px;accent-color:var(--safran);flex:0 0 auto}
.ligne-course.fait{opacity:.4;text-decoration:line-through}
.ligne-course .q{color:var(--encre-douce);font-size:14px;margin-left:auto;text-align:right}
.jour{border:1px solid var(--trait);border-radius:12px;padding:13px;margin-bottom:11px;background:var(--ardoise)}
.jour h3{font-family:var(--serif);font-size:16px;margin:0 0 9px;font-weight:600}
.creneau{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:14.5px}
.creneau .etiq-c{color:var(--encre-douce);font-size:12.5px;width:58px;flex:0 0 auto}
.creneau .nom{flex:1;color:var(--encre)}
.creneau .nom.libre{color:var(--trait)}

/* ---------- mode cuisine ---------- */
#cuisine{background:#0E110F;display:flex;flex-direction:column}
#cuisine .haut{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--trait)}
#cuisine .progression{font-size:13px;color:var(--encre-douce)}
#cuisine .scene{flex:1;display:flex;flex-direction:column;justify-content:center;padding:24px 22px;max-width:680px;margin:0 auto;width:100%}
#cuisine .num{font-family:var(--serif);font-size:15px;color:var(--safran);margin-bottom:14px}
#cuisine .texte{font-family:var(--serif);font-size:clamp(23px,5.6vw,31px);line-height:1.32;font-weight:400;margin:0 0 20px}
#cuisine .ingr-etape{font-size:14.5px;color:var(--encre-douce);border-top:1px solid var(--trait);padding-top:14px}
#cuisine .bas{display:flex;gap:11px;padding:16px 18px calc(22px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--trait)}
#cuisine .bas button{flex:1;padding:16px;border-radius:12px;font-weight:700}
.chrono{font-family:var(--serif);font-size:38px;color:var(--safran);font-weight:600;margin:6px 0 14px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));
  background:var(--ardoise-h);border:1px solid var(--trait);border-radius:999px;padding:11px 20px;font-size:14.5px;
  z-index:90;box-shadow:0 8px 24px rgba(0,0,0,.5);max-width:90vw;text-align:center}
.toast[hidden],#toast[hidden]{display:none!important}
.tourne{display:inline-block;width:14px;height:14px;border:2px solid var(--trait);border-top-color:var(--safran);
  border-radius:999px;animation:t .7s linear infinite;vertical-align:-2px}
@keyframes t{to{transform:rotate(360deg)}}
@media(min-width:620px){.grille{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px}}
</style>
</head>
<body>
<div class="enveloppe">
  <header class="tete">
    <h1 class="marque">Le Carnet<span>ce que tu as enregistré, enfin rangé</span></h1>
    <div class="compteur"><b id="cpt">0</b>recettes</div>
  </header>

  <label class="cherche">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="recherche" type="search" placeholder="Un plat, un ingrédient, un créateur…" autocomplete="off">
  </label>

  <nav class="onglets" role="tablist">
    <button role="tab" data-vue="biblio" aria-selected="true">Recettes</button>
    <button role="tab" data-vue="attente">À compléter <span class="pastille" id="pastille-attente" hidden>0</span></button>
    <button role="tab" data-vue="courses">Courses</button>
    <button role="tab" data-vue="semaine">Semaine</button>
  </nav>

  <section id="vue-biblio">
    <div class="filtres" id="filtres"></div>
    <div class="rangee-tri">
      <span id="resume-filtre">Toutes les recettes</span>
      <select id="tri">
        <option value="recent">Plus récentes</option>
        <option value="titre">Ordre alphabétique</option>
        <option value="temps">Les plus rapides</option>
        <option value="kcal">Moins de calories</option>
        <option value="kcal-desc">Plus de calories</option>
        <option value="note">Mieux notées</option>
      </select>
    </div>
    <div class="grille" id="grille"></div>
  </section>

  <section id="vue-attente" hidden></section>
  <section id="vue-courses" hidden></section>
  <section id="vue-semaine" hidden></section>
</div>

<button class="fab" id="fab">＋ Ajouter</button>

<div class="panneau" id="panneau-ajout" hidden></div>
<div class="panneau" id="panneau-recette" hidden></div>
<div class="panneau" id="cuisine" hidden></div>
<div class="toast" id="toast" hidden></div>
<script>
'use strict';
/* ============================================================
   Le Carnet — bibliothèque de recettes glanées sur les réseaux
   Fichier unique. Fonctionne hors ligne. Aucune donnée ne sort
   du téléphone, sauf si tu demandes une extraction par Claude.
   ============================================================ */

const VERSION = 'carnet-v1';
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const norm = s => (s || '').toLowerCase().replace(/œ/g, 'oe').replace(/æ/g, 'ae').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[’']/g, "'").trim();
const esc = s => (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const arrondi = (n, d) => { const f = Math.pow(10, d || 0); return Math.round(n * f) / f; };

function toast(msg, ms) {
  const t = $('#toast');
  t.innerHTML = msg; t.hidden = false;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.hidden = true; }, ms || 2600);
}

/* ---------------- stockage ---------------- */
const DB = (() => {
  let p = null;
  function ouvrir() {
    if (p) return p;
    p = new Promise((res, rej) => {
      const r = indexedDB.open('carnet', 1);
      r.onupgradeneeded = () => {
        const d = r.result;
        if (!d.objectStoreNames.contains('recettes')) d.createObjectStore('recettes', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('medias')) d.createObjectStore('medias');
        if (!d.objectStoreNames.contains('reglages')) d.createObjectStore('reglages');
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return p;
  }
  async function tx(store, mode, fn) {
    const d = await ouvrir();
    return new Promise((res, rej) => {
      const t = d.transaction(store, mode);
      const rq = fn(t.objectStore(store));
      t.oncomplete = () => res(rq && rq.result);
      t.onerror = () => rej(t.error);
    });
  }
  return {
    tout: () => tx('recettes', 'readonly', s => s.getAll()),
    put: r => tx('recettes', 'readwrite', s => s.put(r)),
    del: id => tx('recettes', 'readwrite', s => s.delete(id)),
    media: (k, b) => b === undefined ? tx('medias', 'readonly', s => s.get(k)) : tx('medias', 'readwrite', s => s.put(b, k)),
    delMedia: k => tx('medias', 'readwrite', s => s.delete(k)),
    reglage: (k, v) => v === undefined ? tx('reglages', 'readonly', s => s.get(k)) : tx('reglages', 'readwrite', s => s.put(v, k))
  };
})();

/* ---------------- état ---------------- */
const App = {
  recettes: [],
  vue: 'biblio',
  filtres: new Set(),
  tri: 'recent',
  q: '',
  courses: { choisies: [], cochees: [] },
  semaine: {},
  urlsMedias: new Map()
};

async function urlMedia(cle) {
  if (!cle) return null;
  if (App.urlsMedias.has(cle)) return App.urlsMedias.get(cle);
  const b = await DB.media(cle);
  if (!b) return null;
  const u = URL.createObjectURL(b);
  App.urlsMedias.set(cle, u);
  return u;
}

function recette(id) { return App.recettes.find(r => r.id === id); }

async function sauver(r) {
  r.majLe = Date.now();
  await DB.put(r);

function trouverAliment(nom) {
  const n = cleAliment(nom);
  if (!n) return null;
  let exact = null, partiel = null, longueur = 0;
  for (const a of TABLE) {
    for (const s of a.syn) {
      if (n === s) { exact = a; break; }
      if ((n.includes(s) || s.includes(n)) && s.length > longueur && s.length > 2) { partiel = a; longueur = s.length; }
    }
    if (exact) break;
  }
  return exact || partiel;
}

const UNITES = [
  [/^(kg|kilos?|kilogrammes?)$/, 1000], [/^(g|gr|grammes?)$/, 1], [/^mg$/, 0.001],
  [/^(l|litres?)$/, 1000], [/^(dl)$/, 100], [/^(cl)$/, 10], [/^(ml|millilitres?)$/, 1],
  [/^(c\.?\s*a\.?\s*s\.?|cas|cs|cuilleres? a soupe|cuillere a soupe|cuilleree a soupe|tbsp)$/, 15],
  [/^(c\.?\s*a\.?\s*c\.?|cac|cc|cuilleres? a cafe|cuillere a cafe|cuillere a the|tsp)$/, 5],
  [/^(pincees?)$/, 1], [/^(gousses?)$/, 5], [/^(verres?)$/, 200], [/^(tasses?|cup|cups)$/, 240],
  [/^(bols?)$/, 300], [/^(bottes?)$/, 80], [/^(branches?|brins?)$/, 8], [/^(feuilles?)$/, 3],
  [/^(filets?|traits?)$/, 5], [/^(noix)$/, 15], [/^(sachets?)$/, 10], [/^(boites?|conserves?)$/, 400],
  [/^(tranches?)$/, 25], [/^(carres?)$/, 5], [/^(cuilleres?|cuillerees?)$/, 12],
  [/^(oz)$/, 28], [/^(lb)$/, 454]
];
const MOT_NOMBRE = { un: 1, une: 1, deux: 2, trois: 3, quatre: 4, cinq: 5, six: 6, sept: 7, huit: 8, neuf: 9, dix: 10, douze: 12, demi: .5, demie: .5, quelques: 3 };

function litQuantite(txt) {
  let t = txt.replace(/^[\s\-–—•·*▪◾✔✅🔸🔹▫️◽➡️👉🥄🥣🧂🍳🧈🥚🧄🧅🍅🥕🧀🍋🌿🥩🍗🐟🍚🍝🥔🍫🍯➖]+/gu, '').trim();
  t = t.replace(/½/g, '0.5').replace(/¼/g, '0.25').replace(/¾/g, '0.75').replace(/⅓/g, '0.33').replace(/⅔/g, '0.66');
  const m = t.match(/^((?:\d+\s*[\/]\s*\d+)|(?:\d+(?:[.,]\d+)?))\s*(?:a|-|à)?\s*(?:\d+(?:[.,]\d+)?)?\s*(.*)$/i);
  let qte = null, reste = t;
  if (m) {
    if (m[1].includes('/')) { const p = m[1].split('/'); qte = Number(p[0]) / Number(p[1]); }
    else qte = Number(m[1].replace(',', '.'));
    reste = m[2];
  } else {
    const mm = t.match(/^(un|une|deux|trois|quatre|cinq|six|sept|huit|neuf|dix|douze|demi|demie|quelques)\s+(.*)$/i);
    if (mm) { qte = MOT_NOMBRE[norm(mm[1])]; reste = mm[2]; }
  }
  let unite = '', reste2 = reste;
  const mu = reste.match(/^([a-zA-Zà-ÿµ°.\s]{1,22}?)\s+(?:de\s+|d[’']\s*)(.+)$/);
  const candidats = [];
  if (mu) candidats.push([mu[1], mu[2]]);
  const mu2 = reste.match(/^([a-zA-Z]{1,4})\s*(.+)$/);
  if (mu2) candidats.push([mu2[1], mu2[2]]);
  const mu3 = reste.match(/^([a-zA-Z]{1,4})$/);
  if (mu3) candidats.push([mu3[1], '']);
  for (const [u, r] of candidats) {
    const nu = norm(u).replace(/\.$/, '');
    if (UNITES.some(([re]) => re.test(nu))) { unite = nu; reste2 = r; break; }
  }
  let nomFinal = reste2.replace(/^[,:\-–\s]+/, '').trim();
  if (qte == null) {
    const fin = nomFinal.match(/^(.*?)[\s:]+(\d+(?:[.,]\d+)?)\s*(kg|g|gr|ml|cl|dl|l)\.?$/i);
    if (fin) { nomFinal = fin[1].trim(); qte = Number(fin[2].replace(',', '.')); unite = norm(fin[3]); }
  }
  return { qte, unite, nom: nomFinal };
}

function enGrammes(ing) {
  if (ing.grammes != null && ing.grammesFige) return ing.grammes;
  const a = ing.aliment ? TABLE.find(x => x.cle === ing.aliment) : null;
  if (ing.unite) {
    const u = UNITES.find(([re]) => re.test(ing.unite));
    if (u) return (ing.qte || 1) * u[1];
  }
  if (ing.qte != null && a && a.unite) return ing.qte * a.unite;
  return null;
}

/* ---------------- nutrition ---------------- */
function calculeNutrition(r) {
  let n = { kcal: 0, prot: 0, lip: 0, sat: 0, gluc: 0, sucres: 0, fibres: 0, sel: 0 };
  let connus = 0, total = 0;
  for (const ing of r.ingredients) {
    total++;
    const a = ing.aliment ? TABLE.find(x => x.cle === ing.aliment) : null;
    const g = enGrammes(ing);
    if (!a || g == null) continue;
    connus++;
    for (const k in n) n[k] += a[k] * g / 100;
  }
  const p = Math.max(1, r.portions || 1);
  for (const k in n) n[k] = arrondi(n[k] / p, k === 'kcal' ? 0 : 1);
  n.couverture = total ? Math.round(connus / total * 100) : 0;
  n.connus = connus; n.total = total;
  return n;
}

  'Goûter': /cookie|muffin|barre|madeleine|gouter|energy ball|financier|pancake/,
  'Apéritif': /aperitif|apero|dip|houmous|tapenade|feuillete|verrine|toast|bouchee|nuggets/,
  'Soupe': /soupe|veloute|bouillon|potage|minestrone/,
  'Salade': /salade|taboule|poke bowl|buddha bowl/,
  'Four': /four|enfourner|prechauff|gratin|rotir|cuire au four/,
  'Airfryer': /airfryer|air fryer|friteuse a air/,
  'Sans cuisson': /sans cuisson|no bake|frigo une nuit|au refrigerateur/,
  'Une seule poêle': /une seule poele|one pan|meme poele/,
  'Mijoté': /mijoter|cocotte|mijote|slow cook/,
  'Batch cooking': /batch|congeler|se conserve|conservation/
};
const PROTEINES = [
  ['Poulet', /poulet|dinde|volaille/], ['Bœuf', /boeuf|steak|bavette|bourguignon|viande hachee/],
  ['Porc', /porc|lardon|jambon|bacon|chorizo|saucisse|filet mignon/], ['Agneau', /agneau|mouton/],
  ['Poisson', /saumon|cabillaud|thon|colin|poisson|truite|merlu|sardine/],
  ['Fruits de mer', /crevette|gambas|moule|calamar|fruits de mer|st jacques|saint jacques/],
  ['Œuf', /oeuf|œuf/], ['Tofu', /tofu|tempeh|seitan/]
];
const ANIMAL = /lait|beurre|creme|fromage|yaourt|oeuf|œuf|miel|parmesan|mozzarella|feta|chevre|ricotta|mascarpone/;
const GLUTEN = /farine|ble|pain|pate|pates|semoule|couscous|boulgour|chapelure|biscuit|brioche|orge|seigle|speculoos|wrap|tortilla|gnocchi/;
const LACTOSE = /lait|beurre|creme|fromage|yaourt|parmesan|mozzarella|feta|chevre|ricotta|mascarpone|emmental|gruyere|comte|cheddar/;

function deduire(r) {
  const texte = norm([r.titre, r.chapeau, r.ingredients.map(i => i.nom).join(' '), r.etapes.map(e => e.texte).join(' ')].join(' '));
  const ingr = norm(r.ingredients.map(i => i.nom).join(' '));
  const etq = new Set(r.etiquettes.filter(t => t && t.startsWith('#')));
  for (const [nom, re] of Object.entries(INDICES)) if (re.test(texte)) etq.add(nom);
  let prot = '';
  for (const [nom, re] of PROTEINES) if (re.test(ingr)) { prot = prot || nom; etq.add(nom); }
  const carne = /poulet|dinde|boeuf|porc|agneau|lardon|jambon|bacon|chorizo|saucisse|viande|saumon|cabillaud|thon|poisson|crevette|moule|gambas|anchois|volaille/.test(ingr);
  if (!carne) {
    etq.add('Végétarien');
    if (!ANIMAL.test(ingr)) etq.add('Végétalien');
  }
  if (!GLUTEN.test(ingr)) etq.add('Sans gluten');
  if (!LACTOSE.test(ingr)) etq.add('Sans lactose');
  const t = (r.tempsPrep || 0) + (r.tempsCuisson || 0);
  if (t && t <= 20) etq.add('Moins de 20 min');
  if (!etq.has('Dessert') && !etq.has('Petit-déjeuner') && !etq.has('Goûter') && !etq.has('Apéritif')) etq.add('Plat');
  r.proteine = prot || (etq.has('Végétarien') ? 'Végétarien' : '');
  return Array.from(etq);
}

/* ---------------- parseur de légende ---------------- */
/* Une capture d'écran ramène l'interface du réseau avec la légende :
   heure, compteurs de mentions j'aime, boutons, date, pseudo du compte
   suivant. Tout cela doit disparaître avant l'analyse. */
const BRUIT = [
  /^\d{1,2}\s*[:h]\s*\d{2}$/,
  /^[\d\s.,]+(k|m|mio|mille)?$/i,
  /^(all posts|posts?|reels?|explorer|accueil|suivre|suivi|abonn\w*|s'abonner|follow(ing|ers)?|voir la traduction|afficher la traduction|voir (plus|moins)|plus|moins|more|less|j'aime|like[sd]?|commentaires?|comments?|partager|share|enregistrer|saved?|envoyer|son original|original audio|audio|sponsoris\w*|publicit\w*|r[ée]pondre|reply)$/i,
  /^\d{1,2}\s+(janv|f[ée]vr|mars|avril|mai|juin|juil|ao[ûu]t|sept|oct|nov|d[ée]c)\w*\.?(\s+\d{4})?$/i,
  /^il y a .{1,24}$/i,
  /^\d+\s*(j|h|min|sem|semaines?|jours?|heures?|mois|ans?)$/i,
  /^[^\p{L}]*$/u
];

function nettoyerLignes(lignes) {
  return lignes.filter(l => {
    const t = l.trim();
    if (!t) return false;
    return !BRUIT.some(re => re.test(t));
  });
}

/* Les hashtags ferment la légende : ce qui suit appartient à l'application. */
function couperApresHashtags(lignes) {
  for (let i = 3; i < lignes.length; i++) {
    const t = lignes[i].replace(/#[\p{L}\d_]+/gu, '').replace(/\b(moins|plus|more|less)\b/gi, '').trim();
    if (!t && /#/.test(lignes[i])) return lignes.slice(0, i);
  }
  return lignes;
}

/* « man_diet.coach LA pépite en déficit calorique » : pseudo puis titre. */
function separerPseudo(ligne) {
  const m = ligne.match(/^([a-z0-9](?:[a-z0-9._]{2,28}))\s+(\p{L}.{4,})$/u);
  if (!m) return null;
  const pseudo = m[1];
  if (!/[._]/.test(pseudo) && !/^[a-z0-9]+$/.test(pseudo)) return null;
  if (trouverAliment(pseudo)) return null;
  return { auteur: '@' + pseudo, titre: m[2].trim() };
}

function ressembleIngredient(l) {
  if (l.length > 80 || /[.!?]\s+\p{Lu}/u.test(l)) return false;
  const q = litQuantite(l);
  const a = trouverAliment(q.nom || l);
  if (q.qte != null && q.unite) return true;
  if (q.qte != null && a) return true;
  if (q.qte == null && a && l.length < 34 && !VERBES.test(l)) return true;
  return false;
}

const RE_INGR = /^\s*[^a-z0-9]{0,4}\s*(ingr[ée]dients?|il (te|vous) faut|il faut|ingredients|liste de courses|pour la (p[âa]te|garniture|sauce|cr[èe]me|marinade)|garniture|marinade|sauce)\s*(\([^)]*\))?\s*[:：]?\s*$/i;
const RE_ETAPE = /^\s*[^a-z0-9]{0,4}\s*(pr[ée]paration|[ée]tapes?|recette|instructions?|method|steps|r[ée]alisation|comment faire|on y va)\s*[:：]?\s*$/i;
const RE_QTE = /^\s*[^a-zA-Z]{0,4}\s*((\d+[.,]?\d*)|½|¼|¾|⅓|⅔|un |une |deux |trois |quatre |cinq |six |quelques )/;
const VERBES = /^(mélange|melange|ajoute|verse|fais|faites|mettre|mets|met|cuire|cuis|préchauffe|prechauffe|incorpore|réserve|reserve|découpe|decoupe|coupe|émince|emince|épluche|epluche|battre|bats|fouette|laisse|enfourne|dispose|assaisonne|sale|poivre|arrose|nappe|démoule|demoule|servir|sers|saupoudre|pétris|petris|étale|etale|badigeonne|remue|porte|plonge|égoutte|egoutte|filtre|dans un|dans une|dans le|dans la|pendant|au four|à la poêle|a la poele|commence|termine|enfin|ensuite|puis)/i;

function parseLegende(texte, source) {
  const r = neuve({ source: Object.assign({ plateforme: '', url: '', auteur: '', texte: texte }, source || {}) });
  const brutes = texte.replace(/\r/g, '').split('\n').map(l => l.trim());
  const hashtags = (texte.match(/#[\p{L}\d_]+/gu) || []).slice(0, 8);
  const lignes = couperApresHashtags(nettoyerLignes(brutes));
  const utiles = [];
  for (let l of lignes) {
    l = l.replace(/#[\p{L}\d_]+/gu, '').trim();
    const au = l.match(/@([\w.]+)/);
    if (au) { if (!r.source.auteur) r.source.auteur = '@' + au[1]; l = l.replace(/@[\w.]+/g, '').trim(); }
    if (l.replace(/[^\p{L}\d]/gu, '').length > 1) utiles.push(l);
  }
  const tete = utiles.length ? separerPseudo(utiles[0]) : null;
  if (tete) { if (!r.source.auteur) r.source.auteur = tete.auteur; utiles[0] = tete.titre; }
  let iIngr = -1, iEtape = -1;
  utiles.forEach((l, i) => {
    if (iIngr < 0 && RE_INGR.test(l)) iIngr = i;
    if (iEtape < 0 && RE_ETAPE.test(l) && i > iIngr) iEtape = i;
  });

  let blocIngr = [], blocEtapes = [], entete = [];
  if (iIngr >= 0) {
    entete = utiles.slice(0, iIngr);
    const fin = iEtape > iIngr ? iEtape : utiles.length;
    blocIngr = utiles.slice(iIngr + 1, fin).filter(l => !RE_INGR.test(l));
    if (iEtape > iIngr) blocEtapes = utiles.slice(iEtape + 1);
  } else {
    utiles.forEach((l, i) => {
      if (!/^\s*\d+\s*[.)]\s/.test(l) && ressembleIngredient(l)) blocIngr.push(l);
      else if (l.length > 28 && VERBES.test(l)) blocEtapes.push(l);
      else if (blocIngr.length === 0 && blocEtapes.length === 0) entete.push(l);
      else if (blocEtapes.length) blocEtapes.push(l);
    });
  }

  const ligneTitre = entete.find(l => l.length > 2 && l.length < 90) || utiles[0] || 'Recette sans titre';
  r.titre = ligneTitre.replace(/^[^\p{L}\d]+/u, '').replace(/[^\p{L}\d)\]!?»"']+$/u, '').replace(/[:：]\s*$/, '').trim();
  if (r.titre.length > 70) r.titre = r.titre.slice(0, 68) + '…';
  const suite = entete.filter(l => l !== ligneTitre).join(' ');
  r.chapeau = suite.length > 4 ? suite.slice(0, 320) : '';

  const mp = texte.match(/pour\s+(\d+)\s*(personnes?|pers|parts?|portions?)/i);
  if (mp) r.portions = Math.min(24, Number(mp[1]));
  else r.portionsDeduites = true;
  const mprep = texte.match(/pr[ée]paration\s*[:：]?\s*(\d+)\s*(min|mn)/i);
  if (mprep) r.tempsPrep = Number(mprep[1]);
  const mcuis = texte.match(/cuisson\s*[:：]?\s*(\d+)\s*(min|mn)/i);
  if (mcuis) r.tempsCuisson = Number(mcuis[1]);

  r.ingredients = blocIngr.map(l => {
    const { qte, unite, nom } = litQuantite(l);
    const a = trouverAliment(nom || l);
    return { qte, unite, nom: (nom || l).replace(/\s+/g, ' ').trim(), brut: l, aliment: a ? a.cle : null };
  }).filter(i => i.nom.length > 1);

  r.etapes = blocEtapes.map(l => l.replace(/^\s*(\d+[.)°]|[-–—•·*▪✅👉➡️])\s*/u, '').trim())
    .filter(l => l.length > 3)
    .map(texteEtape => {
      const m = texteEtape.match(/(\d+)\s*(?:à|-)?\s*(\d+)?\s*(min|mn|minutes?|h|heures?|secondes?|sec)\b/i);
      let minuteur = 0;
      if (m) {
        const v = Number(m[2] || m[1]);
        const u = norm(m[3]);
        minuteur = u.startsWith('h') ? v * 3600 : u.startsWith('sec') ? v : v * 60;
        if (minuteur > 6 * 3600) minuteur = 0;
      }
      return { texte: texteEtape, minuteur };
    });

  if (r.portionsDeduites) {
    const poids = r.ingredients.reduce((a, i) => a + (enGrammes(i) || 0), 0);
    r.portions = poids < 450 ? 1 : poids < 950 ? 2 : poids < 1700 ? 4 : 6;
  }

  if (!r.tempsCuisson && r.etapes.length) {
    const s = r.etapes.reduce((a, e) => a + (e.minuteur || 0), 0);
    if (s) r.tempsCuisson = Math.round(s / 60);
  }
  r.etiquettes = hashtags.slice(0, 8);
  r.etiquettes = deduire(r);
  r.nutrition = calculeNutrition(r);
  r.etat = (r.ingredients.length >= 2 && r.etapes.length >= 1) ? 'prete' : 'attente';
  return r;
}

   Vues

const FILTRES = [
  { id: 'Petit-déjeuner' }, { id: 'Plat' }, { id: 'Dessert' }, { id: 'Goûter' }, { id: 'Apéritif' },
  { id: 'Soupe' }, { id: 'Salade' },
  { id: 'Poulet' }, { id: 'Bœuf' }, { id: 'Porc' }, { id: 'Poisson' }, { id: 'Œuf' }, { id: 'Végétarien' },
  { id: 'Moins de 20 min' }, { id: 'Four' }, { id: 'Airfryer' }, { id: 'Sans cuisson' },
  { id: 'Sans gluten' }, { id: 'Sans lactose' },
  { id: 'Moins de 500 kcal', test: r => r.nutrition && r.nutrition.kcal > 0 && r.nutrition.kcal <= 500 },
  { id: 'Déjà testées', test: r => r.teste },
  { id: 'Jamais testées', test: r => !r.teste }
];

function passeFiltres(r) {
  for (const id of App.filtres) {
    const f = FILTRES.find(x => x.id === id);
    const ok = f && f.test ? f.test(r) : (r.etiquettes || []).includes(id);
    if (!ok) return false;
  }
  if (App.q) {
    const foin = norm([r.titre, r.chapeau, (r.etiquettes || []).join(' '), r.source.auteur,
    r.ingredients.map(i => i.nom).join(' ')].join(' '));
    if (!norm(App.q).split(/\s+/).every(m => foin.includes(m))) return false;
  }
  return true;
}

function tempsTotal(r) { return (r.tempsPrep || 0) + (r.tempsCuisson || 0); }

function trier(liste) {
  const l = liste.slice();
  const par = {
    recent: (a, b) => b.creeLe - a.creeLe,
    titre: (a, b) => a.titre.localeCompare(b.titre, 'fr'),
    temps: (a, b) => (tempsTotal(a) || 9999) - (tempsTotal(b) || 9999),
    kcal: (a, b) => ((a.nutrition && a.nutrition.kcal) || 9999) - ((b.nutrition && b.nutrition.kcal) || 9999),
    'kcal-desc': (a, b) => ((b.nutrition && b.nutrition.kcal) || 0) - ((a.nutrition && a.nutrition.kcal) || 0),
    note: (a, b) => (b.note || 0) - (a.note || 0) || b.creeLe - a.creeLe
  };
  return l.sort(par[App.tri] || par.recent);
}

function rendreFiltres() {
  const c = $('#filtres');
  c.innerHTML = FILTRES.map(f =>
    `<button class="puce" data-f="${esc(f.id)}" aria-pressed="${App.filtres.has(f.id)}">${esc(f.id)}</button>`).join('');
  c.onclick = e => {
    const b = e.target.closest('[data-f]'); if (!b) return;
    const id = b.dataset.f;
    App.filtres.has(id) ? App.filtres.delete(id) : App.filtres.add(id);
    rendreFiltres(); rendreBiblio();
  };
}

function carte(r) {
  const t = tempsTotal(r);
  const meta = [];
  if (t) meta.push(t >= 60 ? Math.floor(t / 60) + ' h ' + (t % 60 ? (t % 60) + ' min' : '') : t + ' min');
  if (r.proteine) meta.push(r.proteine);
  else if ((r.etiquettes || [])[0]) meta.push(r.etiquettes[0]);
  const kcal = r.nutrition && r.nutrition.kcal ? `<span class="kcal">${r.nutrition.kcal} kcal</span>` : '';
  return `<button class="fiche" data-id="${r.id}">
    <span class="vignette" data-media="${esc(r.mediaPerso || r.media || '')}">
      <span class="vide">${esc((r.titre || '?').slice(0, 1).toUpperCase())}</span>${kcal}
      ${r.teste ? '<span class="coche">✓</span>' : ''}
    </span>
    <span class="corps-fiche">
      <h3>${esc(r.titre || 'Sans titre')}</h3>
      <span class="meta">${meta.map(m => `<span>${esc(m)}</span>`).join('')}</span>
    </span>
  </button>`;
}

async function peuplerVignettes(racine) {
  for (const v of $$('[data-media]', racine)) {
    const cle = v.dataset.media; if (!cle) continue;
    const u = await urlMedia(cle);
    if (u) v.insertAdjacentHTML('afterbegin', `<img src="${u}" alt="">`);
    v.removeAttribute('data-media');
  }
}

function rendreBiblio() {
  const pretes = App.recettes.filter(r => r.etat === 'prete');
  const liste = trier(pretes.filter(passeFiltres));
  const g = $('#grille');
  $('#resume-filtre').textContent = App.filtres.size || App.q
    ? `${liste.length} recette${liste.length > 1 ? 's' : ''} sur ${pretes.length}`
    : `${pretes.length} recette${pretes.length > 1 ? 's' : ''}`;
  if (!liste.length) {
    g.innerHTML = `<div class="vide-etat" style="grid-column:1/-1">
      <p class="glyphe">✳</p>
      <p>${pretes.length ? 'Aucune recette ne correspond. Retire un filtre pour élargir.' :
        'Ton carnet est vide. Partage une publication Instagram vers Le Carnet, ou colle la légende d’une recette.'}</p>
      ${pretes.length ? '' : '<button class="bouton" onclick="ouvrirAjout()">Ajouter une recette</button>'}
    </div>`;
    return;
  }
  g.innerHTML = liste.map(carte).join('');
  g.onclick = e => { const b = e.target.closest('[data-id]'); if (b) ouvrirRecette(b.dataset.id); };
  peuplerVignettes(g);
}

function rendreAttente() {
  const v = $('#vue-attente');
  const liste = App.recettes.filter(r => r.etat === 'attente').sort((a, b) => b.creeLe - a.creeLe);
  const n = liste.length;

      <span style="flex:1;min-width:0">
        <span class="titre">${esc(r.titre || 'Publication partagée')}</span>
        <span class="lien">${esc(r.source.auteur ? r.source.auteur + ' — ' : '')}${esc((r.source.url || 'sans lien').replace(/^https?:\/\//, '').slice(0, 64))}</span>
      </span>
    </button>`).join('');
  v.onclick = e => { const b = e.target.closest('[data-id]'); if (b) ouvrirRecette(b.dataset.id); };
  peuplerVignettes(v);

/* ---------------- courses ---------------- */
function agregerCourses(ids) {
  const paniers = new Map();
  for (const id of ids) {
    const r = recette(id); if (!r) continue;
    for (const ing of r.ingredients) {
      const a = ing.aliment ? TABLE.find(x => x.cle === ing.aliment) : null;
      const cle = a ? a.cle : norm(ing.nom).replace(MOTS_VIDES, ' ').replace(/\s+/g, ' ').trim();
      if (!cle) continue;
      const g = enGrammes(ing);
      const e = paniers.get(cle) || { nom: a ? a.cle.charAt(0).toUpperCase() + a.cle.slice(1) : ing.nom, rayon: a ? a.rayon : 'X', grammes: 0, libres: [] };
      if (g != null && a) e.grammes += g; else e.libres.push([ing.qte, ing.unite, ing.nom].filter(Boolean).join(' '));
      paniers.set(cle, e);
    }
  }
  const parRayon = {};
  for (const [cle, e] of paniers) {
    (parRayon[e.rayon] = parRayon[e.rayon] || []).push(Object.assign({ cle }, e));
  }
  return parRayon;
}

function quantiteLisible(e) {
  const bouts = [];
  if (e.grammes) bouts.push(e.grammes >= 1000 ? arrondi(e.grammes / 1000, 2) + ' kg' : Math.round(e.grammes) + ' g');
  if (e.libres.length) bouts.push(e.libres.slice(0, 3).join(' + '));
  return bouts.join(' + ');
}

      </label>`).join('')}`).join('')
      + `<div class="rangee-actions"><button class="bouton fantome" id="copier-courses">Copier la liste</button>
         <button class="bouton fantome" id="vider-courses">Tout décocher</button></div>`
      : '<div class="vide-etat"><p class="glyphe">☐</p><p>Choisis une ou plusieurs recettes ci-dessus.</p></div>'}`;

  v.onclick = async e => {
    const p = e.target.closest('[data-pick]');

      const i = App.courses.choisies.indexOf(id);
      i < 0 ? App.courses.choisies.push(id) : App.courses.choisies.splice(i, 1);
      await DB.reglage('courses', App.courses); rendreCourses(); return;
    }
    if (e.target.id === 'vider-courses') { App.courses.cochees = []; await DB.reglage('courses', App.courses); rendreCourses(); return; }
    if (e.target.id === 'copier-courses') {
      const txt = ordre.filter(k => parRayon[k]).map(k => RAYONS[k] + '\n' +
        parRayon[k].map(x => '- ' + x.nom + (quantiteLisible(x) ? ' : ' + quantiteLisible(x) : '')).join('\n')).join('\n\n');
      try { await navigator.clipboard.writeText(txt); toast('Liste copiée'); } catch { toast('Copie impossible'); }
    }
  };
  v.onchange = async e => {
    const c = e.target.closest('[data-coche]'); if (!c) return;
    const cle = c.dataset.coche;
    const i = App.courses.cochees.indexOf(cle);
    i < 0 ? App.courses.cochees.push(cle) : App.courses.cochees.splice(i, 1);
    await DB.reglage('courses', App.courses);
    c.closest('.ligne-course').classList.toggle('fait', i < 0);
  };
}

let portionsAffichees = null;

function fmtQte(ing, facteur) {
  if (ing.qte == null) return '';
  let q = ing.qte * facteur;
  let u = ing.unite || '';
  if (u === 'kg' && q < 1) { q *= 1000; u = 'g'; }
  if (u === 'l' && q < 1) { q *= 1000; u = 'ml'; }
  const aff = q < 10 ? arrondi(q, 2) : Math.round(q);
  return (String(aff).replace('.', ',') + ' ' + u).trim();
}

function fmtDuree(s) {
  if (s >= 3600) return Math.floor(s / 3600) + ' h' + (s % 3600 ? ' ' + Math.round((s % 3600) / 60) + ' min' : '');
  return Math.round(s / 60) + ' min';
}

async function gererClicRecette(e, r) {
  const p = $('#panneau-recette');
  if (e.target.closest('[data-fermer]')) { p.hidden = true; rafraichir(); return; }
  const pl = e.target.closest('[data-portion]');
  if (pl) { portionsAffichees = Math.max(1, Math.min(30, portionsAffichees + Number(pl.dataset.portion))); dessinerRecette(r); return; }
  const et = e.target.closest('[data-note]');
  if (et) { r.note = r.note === Number(et.dataset.note) ? 0 : Number(et.dataset.note); await sauver(r); dessinerRecette(r); return; }
  const h = e.target.closest('[data-hero]');
  if (h) {
    r.media = (r.media === h.dataset.hero) ? null : h.dataset.hero;
    await sauver(r); await dessinerRecette(r); rafraichir();
    toast(r.media ? 'Illustration choisie' : 'Illustration retirée');
    return;
  }
  if (e.target.closest('[data-cuisine]')) { modeCuisine(r); return; }
  if (e.target.closest('[data-editer]')) { editer(r); return; }
  if (e.target.closest('[data-courses]')) {
    if (!App.courses.choisies.includes(r.id)) App.courses.choisies.push(r.id);
    await DB.reglage('courses', App.courses); toast('Ajoutée aux courses'); return;
  }
  if (e.target.closest('[data-supprimer]')) {
    if (!confirm('Supprimer « ' + (r.titre || 'cette fiche') + ' » ? C’est définitif.')) return;
    await DB.del(r.id);
    for (const c of [r.media, r.mediaPerso].concat(r.captures || [])) if (c) DB.delMedia(c);
    App.recettes = App.recettes.filter(x => x.id !== r.id);
    p.hidden = true; rafraichir(); toast('Recette supprimée'); return;
  }
  if (e.target.closest('[data-analyser]')) { await analyser(r); return; }
  if (e.target.closest('[data-prompt]')) {
    const txt = $('[data-legende]', p).value;
    try { await navigator.clipboard.writeText(PROMPT_EXTRACTION + '\n\n---\n' + txt); toast('Texte copié. Colle-le dans Claude, puis rapporte le JSON.'); }
    catch { toast('Copie impossible'); }
    return;
  }
  if (e.target.closest('[data-coller-json]')) {
    const j = prompt('Colle ici la fiche JSON produite par Claude :');
    if (!j) return;
    try { await appliquerJSON(r, JSON.parse(j.replace(/^```json|```$/g, '').trim())); toast('Fiche complétée'); }
    catch (err) { toast('JSON illisible'); }
    return;
  }
}

async function gererChangementRecette(e, r) {
  if (e.target.matches('[data-teste]')) {
    r.teste = e.target.checked;
    if (r.teste) (r.cuisineLe = r.cuisineLe || []).push(Date.now());
    await sauver(r); return;
  }
  if (e.target.matches('[data-notes]')) { r.notes = e.target.value; await sauver(r); return; }
  if (e.target.matches('[data-photo]')) {
    const f = e.target.files[0]; if (!f) return;
    const cle = uid(); await DB.media(cle, f); r.mediaPerso = cle; await sauver(r); dessinerRecette(r); toast('Photo enregistrée'); return;
  }
  if (e.target.matches('[data-captures]')) {
    const fs = Array.from(e.target.files);
    if (!fs.length) return;
    r._captures = fs;
    const etat = $('#etat-media');
    if (etat) etat.textContent = fs.map(f => (estVideo(f) ? '🎬 ' : '🖼 ') + (f.name || 'fichier')).join(', ') + ' — appuie sur « Créer la fiche ».';
    toast('Prêt à analyser');
  }
}

   ============================================================ */
const PROMPT_EXTRACTION = `Tu reçois la légende d'une publication de réseau social qui contient une recette de cuisine.
Réponds UNIQUEMENT par un objet JSON valide, sans texte autour, sans balises de code, au format :
{"titre":"", "chapeau":"une phrase", "portions":4, "tempsPrep":0, "tempsCuisson":0,
 "ingredients":[{"qte":200,"unite":"g","nom":"farine"}],
 "etapes":["première étape","deuxième étape"],
 "etiquettes":["Plat","Four"]}
Règles : unités en g, ml, cs (cuillère à soupe), cc (cuillère à café), ou vide pour les unités (2 œufs).
"qte" vaut null si la quantité n'est pas donnée. Traduis en français. N'invente aucun ingrédient absent du texte.`;

async function claudeDispo() {
  try {
    if (!window.claude || typeof window.claude.use !== 'function') return null;
    return await window.claude.use('sample');
  } catch (e) { return null; }
}

async function versBase64(f) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(',')[1]);
    r.onerror = () => rej(r.error);
    r.readAsDataURL(f);
  });
}

async function appliquerJSON(r, j) {
  r.titre = j.titre || r.titre || 'Recette';
  r.chapeau = j.chapeau || '';
  r.portions = Math.max(1, Number(j.portions) || 4);
  r.tempsPrep = Number(j.tempsPrep) || 0;
  r.tempsCuisson = Number(j.tempsCuisson) || 0;
  r.ingredients = (j.ingredients || []).map(i => {
    const nom = String(i.nom || '').trim();
    const a = trouverAliment(nom);
    return { qte: i.qte == null ? null : Number(i.qte), unite: norm(i.unite || ''), nom, brut: nom, aliment: a ? a.cle : null };
  }).filter(i => i.nom);
  r.etapes = (j.etapes || []).map(t => {
    const texte = typeof t === 'string' ? t : (t.texte || '');
    const m = texte.match(/(\d+)\s*(min|mn|minutes?|h|heures?)\b/i);
    const v = m ? Number(m[1]) : 0;
    return { texte, minuteur: m ? (norm(m[2]).startsWith('h') ? v * 3600 : v * 60) : 0 };
  }).filter(e => e.texte);
  r.etiquettes = Array.isArray(j.etiquettes) ? j.etiquettes.slice(0, 10) : [];
  r.etiquettes = deduire(r);
  r.nutrition = calculeNutrition(r);
  r.etat = 'prete';
  await sauver(r);
  portionsAffichees = r.portions;
  await dessinerRecette(r);
  rafraichir();
}

const Cuisine = { r: null, i: 0, chrono: null, reste: 0, veille: null };

async function modeCuisine(r) {
  if (!r.etapes.length) { toast('Aucune étape à suivre.'); return; }
  Cuisine.r = r; Cuisine.i = 0;
  $('#cuisine').hidden = false;
  try { if ('wakeLock' in navigator) Cuisine.veille = await navigator.wakeLock.request('screen'); } catch (e) { }
  dessinerCuisine();
}

function dessinerCuisine() {
  const { r, i } = Cuisine;
  const e = r.etapes[i];
  const facteur = (portionsAffichees || r.portions) / (r.portions || 1);
  const mots = norm(e.texte);
  const concernes = r.ingredients.filter(ing => {
    const n = norm(ing.nom).replace(MOTS_VIDES, ' ').trim().split(' ').filter(w => w.length > 3);
    return n.some(w => mots.includes(w));
  });
  $('#cuisine').innerHTML = `
    <div class="haut">
      <button class="ferme" data-sortir>✕</button>
      <span class="progression">Étape ${i + 1} sur ${r.etapes.length}</span>
      <span class="progression">${portionsAffichees} portions</span>
    </div>
    <div class="scene">
      <div class="num">${esc(r.titre)}</div>
      <p class="texte">${esc(e.texte)}</p>
      ${Cuisine.chrono ? `<div class="chrono" id="affiche-chrono">${fmtChrono(Cuisine.reste)}</div>
        <div><button class="bouton fantome" data-stop>Arrêter le minuteur</button></div>`
      : e.minuteur ? `<div><button class="bouton" data-lancer="${e.minuteur}">⏱ Lancer ${fmtDuree(e.minuteur)}</button></div>` : ''}
      ${concernes.length ? `<div class="ingr-etape">${concernes.map(ing => `${esc(fmtQte(ing, facteur))} ${esc(ing.nom)}`).join(' · ')}</div>` : ''}
    </div>
    <div class="bas">
      <button class="bouton fantome" data-prec ${i === 0 ? 'disabled' : ''}>Précédent</button>
      <button class="bouton" data-suiv>${i === r.etapes.length - 1 ? 'Terminé' : 'Suivant'}</button>
    </div>`;
}

function fmtChrono(s) {
  const m = Math.floor(s / 60), x = s % 60;
  return String(m).padStart(2, '0') + ':' + String(x).padStart(2, '0');
}

function arreterChrono() { clearInterval(Cuisine.chrono); Cuisine.chrono = null; Cuisine.reste = 0; }

$('#cuisine').addEventListener('click', async e => {
  if (e.target.closest('[data-sortir]')) {
    arreterChrono();
    try { if (Cuisine.veille) { await Cuisine.veille.release(); Cuisine.veille = null; } } catch (err) { }
    $('#cuisine').hidden = true; return;
  }
  const l = e.target.closest('[data-lancer]');
  if (l) {
    Cuisine.reste = Number(l.dataset.lancer);
    Cuisine.chrono = setInterval(() => {
      Cuisine.reste--;
      const a = $('#affiche-chrono');
      if (a) a.textContent = fmtChrono(Cuisine.reste);
      if (Cuisine.reste <= 0) {
        arreterChrono(); dessinerCuisine();
        if (navigator.vibrate) navigator.vibrate([400, 200, 400]);
        toast('⏱ Minuteur terminé');
      }
    }, 1000);
    dessinerCuisine(); return;
  }
  if (e.target.closest('[data-stop]')) { arreterChrono(); dessinerCuisine(); return; }
  if (e.target.closest('[data-prec]')) { Cuisine.i = Math.max(0, Cuisine.i - 1); arreterChrono(); dessinerCuisine(); return; }
  if (e.target.closest('[data-suiv]')) {
    if (Cuisine.i === Cuisine.r.etapes.length - 1) {
      arreterChrono();
      try { if (Cuisine.veille) { await Cuisine.veille.release(); Cuisine.veille = null; } } catch (err) { }
      $('#cuisine').hidden = true;
      const r = Cuisine.r;
      if (!r.teste) { r.teste = true; (r.cuisineLe = r.cuisineLe || []).push(Date.now()); await sauver(r); await dessinerRecette(r); rafraichir(); }
      toast('Bon appétit.');
      return;
    }
    Cuisine.i++; arreterChrono(); dessinerCuisine();
  }
});
/* ============================================================
   Lecture des images et des vidéos
   - avec Claude (version artefact) : analyse directe des images
   - sans Claude (version installée) : reconnaissance de texte
     hors ligne par Tesseract, téléchargé une seule fois
   ============================================================ */

function estVideo(f) {
  return /^video\//.test(f.type || '') || /\.(mp4|mov|webm|m4v|avi)$/i.test(f.name || '');
}

function chargerScript(src) {
  return new Promise((res, rej) => {
    if (document.querySelector('script[data-src="' + src + '"]')) return res();
    const s = document.createElement('script');
    s.src = src; s.dataset.src = src;
    s.onload = () => res(); s.onerror = () => rej(new Error('téléchargement impossible'));
    document.head.appendChild(s);
  });
}

const Lecture = { moteur: null };

async function moteurOCR(progres) {
  if (Lecture.moteur) return Lecture.moteur;
  progres('Téléchargement du lecteur de texte (une seule fois)…');
  await chargerScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');
  if (typeof Tesseract === 'undefined') throw new Error('lecteur indisponible');
  Lecture.moteur = await Tesseract.createWorker('fra', 1, {
    workerPath: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js',
    corePath: 'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1',
    logger: m => { if (m.status === 'recognizing text') progres('Lecture du texte… ' + Math.round((m.progress || 0) * 100) + ' %'); }
  });
  return Lecture.moteur;
}

/* --- images extraites d'une vidéo --- */
async function imagesDepuisVideo(fichier, combien, progres) {
  const url = URL.createObjectURL(fichier);
  const v = document.createElement('video');
  v.src = url; v.muted = true; v.playsInline = true; v.preload = 'auto';
  try {
    await new Promise((res, rej) => {
      v.onloadedmetadata = res;
      v.onerror = () => rej(new Error('vidéo illisible'));
      setTimeout(() => rej(new Error('vidéo trop longue à ouvrir')), 15000);
    });
    const duree = v.duration && isFinite(v.duration) ? v.duration : 0;
    if (!duree) throw new Error('durée inconnue');
    const n = Math.max(3, Math.min(combien, Math.round(duree / 2)));
    const c = document.createElement('canvas');
    const k = Math.min(1, 1000 / Math.max(v.videoWidth || 1000, v.videoHeight || 1000));
    c.width = Math.round((v.videoWidth || 720) * k);
    c.height = Math.round((v.videoHeight || 1280) * k);
    const ctx = c.getContext('2d');
    const images = [];
    for (let i = 0; i < n; i++) {
      const t = duree * (i + 0.5) / n;
      await new Promise((res, rej) => {
        v.onseeked = res;
        v.currentTime = Math.min(t, Math.max(0, duree - 0.05));
        setTimeout(res, 4000);
      });
      ctx.drawImage(v, 0, 0, c.width, c.height);
      const b = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
      if (b) images.push(b);
      progres('Extraction des images… ' + (i + 1) + ' sur ' + n);
    }
    return images;
  } finally { URL.revokeObjectURL(url); }
}

/* --- rassemble les images à analyser --- */
async function imagesAAnalyser(fichiers, maxParVideo, progres) {
  const out = [];
  for (const f of fichiers) {
    if (estVideo(f)) {
      try { out.push.apply(out, await imagesDepuisVideo(f, maxParVideo, progres)); }
      catch (e) { toast('Vidéo illisible par le navigateur. Essaie une capture d’écran.'); }
    } else out.push(f);
  }
  return out;
}

/* --- fusionne le texte lu sur plusieurs images --- */
function fusionnerLignes(blocs) {
  const vues = new Set(); const lignes = [];
  for (const bloc of blocs) {
    for (let l of String(bloc || '').split('\n')) {
      l = l.replace(/\s+/g, ' ').trim();
      if (l.length < 3) continue;
      if (!/[a-zà-ÿ]/i.test(l)) continue;
      const cle = norm(l).replace(/[^a-z0-9]/g, '');
      if (cle.length < 3 || vues.has(cle)) continue;
      vues.add(cle); lignes.push(l);
    }
  }
  return lignes.join('\n');
}

async function texteDepuisImages(images, progres) {
  const moteur = await moteurOCR(progres);
  const blocs = [];
  for (let i = 0; i < images.length; i++) {
    progres('Lecture de l’image ' + (i + 1) + ' sur ' + images.length + '…');
    try { const { data } = await moteur.recognize(images[i]); blocs.push(data.text || ''); }
    catch (e) { /* on continue avec les autres */ }
  }
  return fusionnerLignes(blocs);
}

/* ============================================================
   Analyse : texte collé, captures d'écran, vidéo
   ============================================================ */
async function rangerCaptures(r, images) {
  r.captures = r.captures || [];
  for (const img of images.slice(0, 4)) {
    if (r.captures.length >= 6) break;
    const cle = uid();
    await DB.media(cle, img);
    r.captures.push(cle);
  }
}

async function analyser(r) {
  const p = $('#panneau-recette');
  const champ = $('[data-legende]', p);
  const texte = (champ ? champ.value : r.source.texte || '').trim();
  const fichiers = (r._captures || []).slice(0, 4);
  if (!texte && !fichiers.length) { toast('Colle la légende, ou dépose une capture d’écran ou la vidéo.'); return; }

  const bouton = $('[data-analyser]', p);
  const avance = m => { if (bouton) bouton.innerHTML = '<span class="tourne"></span> ' + esc(m); };
  if (bouton) bouton.disabled = true;
  avance('Lecture…');

  let fait = false;
  try {
    const sample = await claudeDispo();

    /* --- voie 1 : Claude regarde les images lui-même --- */
    if (sample && fichiers.length) {
      const limites = await Promise.resolve(sample.limits && sample.limits()).catch(() => ({}));
      if (limites && limites.images) {
        const images = await imagesAAnalyser(fichiers, 6, avance);
        avance('Claude analyse…');
        const contenu = [];
        for (const img of images.slice(0, 6)) {
          contenu.push({
            type: 'image',
            source: { type: 'base64', media_type: img.type || 'image/jpeg', data: await versBase64(img) }
          });
        }
        contenu.push({
          type: 'text', text: PROMPT_EXTRACTION +
            '\n\nLes images ci-dessus viennent d’une publication de recette (captures d’écran ou images extraites de la vidéo). Lis le texte qui y est affiché et ce que tu vois préparer.' +
            (texte ? '\n\nLégende de la publication :\n' + texte : '')
        });
        const j = await sample.json([{ role: 'user', content: contenu }], { modelTier: 'default' });
        await rangerCaptures(r, images);
        await appliquerJSON(r, j); fait = true;
      }
    }

    /* --- voie 2 : Claude lit la légende --- */
    if (!fait && sample && texte) {
      avance('Claude analyse…');
      const j = await sample.json([{ role: 'user', content: PROMPT_EXTRACTION + '\n\n---\n' + texte }], { modelTier: 'default' });
      await appliquerJSON(r, j); fait = true;
    }

    /* --- voie 3 : reconnaissance de texte sur l'appareil --- */
    if (!fait && fichiers.length) {
      const images = await imagesAAnalyser(fichiers, 8, avance);
      if (images.length) {
        const lu = await texteDepuisImages(images, avance);
        await rangerCaptures(r, images);
        if (lu && lu.length > 20) {
          const complet = [texte, lu].filter(Boolean).join('\n');
          if (champ) champ.value = complet;
          appliquerLecture(r, complet); fait = true;
        } else if (!texte) {
          toast('Texte illisible sur ces images. Essaie une capture plus nette, ou colle la légende.');
        }
      }
    }

    /* --- voie 4 : parseur local sur la légende --- */
    if (!fait && texte) { appliquerLecture(r, texte); fait = true; }
  } catch (e) {
    if (texte) { appliquerLecture(r, texte); fait = true; }
    else toast('Analyse impossible : ' + (e && e.message ? e.message : 'erreur inconnue'));
  }

  if (bouton) { bouton.disabled = false; bouton.textContent = 'Créer la fiche'; }
  if (!fait) return;
  delete r._captures;
  portionsAffichees = r.portions;
  await sauver(r);
  await dessinerRecette(r);
  rafraichir();
  toast('Fiche créée. Relis-la et corrige avec « Modifier ».');
}

function appliquerLecture(r, texte) {
  const lu = parseLegende(texte, r.source);
  Object.assign(r, {
    titre: lu.titre, chapeau: lu.chapeau, portions: lu.portions, tempsPrep: lu.tempsPrep,
    tempsCuisson: lu.tempsCuisson, ingredients: lu.ingredients, etapes: lu.etapes,
    etiquettes: lu.etiquettes, proteine: lu.proteine, nutrition: lu.nutrition
  });
  r.source.texte = texte;
  r.etat = 'prete';
}
/* ============================================================
   Ajouter une recette
   ============================================================ */
function ouvrirAjout() {
  const p = $('#panneau-ajout');
  p.hidden = false; p.scrollTop = 0;
  p.innerHTML = `<div class="barre-panneau"><button class="ferme" data-fermer>←</button><h2>Ajouter une recette</h2></div>
  <div class="dedans">
    <p class="aide">Colle la légende de la publication — ou son premier commentaire, là où la recette se cache souvent. Le titre, les quantités, les étapes et la valeur nutritionnelle se remplissent ensuite tout seuls.</p>
    <textarea class="zone" id="a-texte" placeholder="🍝 Pâtes crémeuses au citron&#10;&#10;Ingrédients :&#10;- 300 g de pâtes&#10;- 20 cl de crème&#10;…"></textarea>
    <label class="champ" style="margin-top:14px"><span>Lien d’origine (facultatif)</span>
      <input id="a-url" inputmode="url" placeholder="https://www.instagram.com/reel/…"></label>
    <label class="choix-fichier">🖼 Captures d’écran, photo ou vidéo de la recette
      <input type="file" accept="image/*,video/*" multiple id="a-image" hidden></label>
    <p class="aide" id="a-etat-media" style="margin:0 0 14px"></p>
    <div class="rangee-actions">
      <button class="bouton" id="a-creer">Créer la fiche</button>
      <button class="bouton fantome" id="a-vide">Fiche vierge à remplir</button>
    </div>
    <h2 class="rubrique">Sauvegarde</h2>
    <p class="aide">Tout est stocké sur ton téléphone. Exporte de temps en temps pour ne rien perdre.</p>
    <div class="rangee-actions">
      <button class="bouton fantome" id="a-export">Exporter mes recettes</button>
      <label class="bouton fantome" style="cursor:pointer">Importer une sauvegarde
        <input type="file" accept="application/json,.json" id="a-import" hidden></label>
    </div>
  </div>`;

  p.onclick = async e => {
    if (e.target.closest('[data-fermer]')) { p.hidden = true; return; }
    if (e.target.id === 'a-creer') {
      const texte = $('#a-texte').value.trim();
      const fichiers = Array.from(($('#a-image').files) || []);
      if (!texte && !fichiers.length) { toast('Colle la légende, ou dépose une capture d’écran ou la vidéo.'); return; }
      const url = $('#a-url').value.trim();
      const r = neuve({
        source: { url, plateforme: plateforme(url), auteur: auteurDepuisUrl(url), texte },
        titre: 'Lecture en cours…'
      });
      r._captures = fichiers;
      await sauver(r);
      p.hidden = true;
      await ouvrirRecette(r.id);
      await analyser(r);
      return;
    }
    if (e.target.id === 'a-vide') {
      const r = neuve({ titre: 'Nouvelle recette', etat: 'prete' });
      await sauver(r);
      p.hidden = true; rafraichir(); await ouvrirRecette(r.id); editer(r);
      return;
    }
    if (e.target.id === 'a-export') { await exporter(); return; }
  };
  p.onchange = async e => {
    if (e.target.id === 'a-image') {
      const fs = Array.from(e.target.files || []);
      const etat = $('#a-etat-media');
      if (etat) etat.textContent = fs.length ? fs.map(f => (estVideo(f) ? '🎬 ' : '🖼 ') + (f.name || 'fichier')).join(', ') : '';
      return;
    }
    if (e.target.id !== 'a-import') return;
    const f = e.target.files[0]; if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      const liste = Array.isArray(data) ? data : data.recettes || [];
      let n = 0;
      for (const r of liste) {
        if (!r || !r.id) continue;
        if (App.recettes.some(x => x.id === r.id)) continue;
        delete r.media; delete r.mediaPerso;
        await sauver(r); n++;
      }
      rafraichir(); toast(n + ' recette' + (n > 1 ? 's' : '') + ' importée' + (n > 1 ? 's' : ''));
    } catch (err) { toast('Fichier illisible'); }
  };
}

async function exporter() {
  const data = { app: 'Le Carnet', version: VERSION, date: new Date().toISOString(), recettes: App.recettes };
  const txt = JSON.stringify(data, null, 1);
  const nom = 'carnet-recettes-' + new Date().toISOString().slice(0, 10) + '.json';
  try {
    const d = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if (d) { await d.save({ filename: nom, data: txt }); toast('Sauvegarde enregistrée'); return; }
  } catch (e) { }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt], { type: 'application/json' }));
  a.download = nom; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('Sauvegarde téléchargée');
}

/* ============================================================
   Réception d'un partage
   ============================================================ */
function plateforme(url) {
  const u = norm(url || '');
  if (u.includes('instagram')) return 'Instagram';
  if (u.includes('facebook') || u.includes('fb.watch')) return 'Facebook';
  if (u.includes('tiktok')) return 'TikTok';
  if (u.includes('youtu')) return 'YouTube';
  if (u.includes('pinterest')) return 'Pinterest';
  return u ? 'Web' : '';
}

function auteurDepuisUrl(url) {
  const m = (url || '').match(/instagram\.com\/([\w.]+)\//);
  return m && !['reel', 'p', 'reels', 'tv'].includes(m[1]) ? '@' + m[1] : '';
}

async function lireCachePartage() {
  try {
    const c = await caches.open('carnet-partage');
    const rep = await c.match('/__partage');
    if (!rep) return null;
    const charge = await rep.json();
    charge.fichiers = [];
    for (let i = 0; i < (charge.nbFichiers || 0); i++) {
      const rf = await c.match('/__partage-fichier-' + i);
      if (rf) charge.fichiers.push(await rf.blob());
    }
    await c.delete('/__partage');
    for (let i = 0; i < (charge.nbFichiers || 0); i++) await c.delete('/__partage-fichier-' + i);
    return charge;
  } catch (e) { return null; }
}

async function traiterPartage() {
  const p = new URL(location.href).searchParams;
  let charge = null;
  if (p.get('partage')) charge = await lireCachePartage();
  else if (p.get('url') || p.get('text') || p.get('title')) {
    charge = { titre: p.get('title') || '', texte: p.get('text') || '', url: p.get('url') || '', fichiers: [] };
  }
  if (!charge) return;
  history.replaceState({}, '', location.pathname);

  const texte = (charge.texte || '').trim();
  const mu = (charge.url || texte).match(/https?:\/\/\S+/);
  const url = charge.url || (mu ? mu[0] : '');
  const src = { url, plateforme: plateforme(url), auteur: auteurDepuisUrl(url), texte };
  const corps = texte.replace(/https?:\/\/\S+/g, '').trim();

  let r;
  if (corps.length > 110 && /\n/.test(corps)) { r = parseLegende(corps, src); }
  else { r = neuve({ source: src, titre: (charge.titre || '').slice(0, 70) }); }
  if (charge.fichiers && charge.fichiers[0]) { const cle = uid(); await DB.media(cle, charge.fichiers[0]); r.media = cle; }
  await sauver(r);
  rafraichir();
  if (r.etat === 'prete') { await ouvrirRecette(r.id); toast('Recette lue depuis le partage'); }
  else { basculer('attente'); toast('Publication rangée. Complète-la quand tu veux.'); }
}

/* ============================================================
   Démarrage
   ============================================================ */
async function demarrer() {
  try {
    App.recettes = (await DB.tout()) || [];
    App.courses = (await DB.reglage('courses')) || { choisies: [], cochees: [] };
    App.semaine = (await DB.reglage('semaine')) || {};
  } catch (e) { toast('Stockage indisponible : les ajouts ne seront pas conservés.'); }

  rendreFiltres();
  $('#fab').onclick = ouvrirAjout;
  $$('nav.onglets button').forEach(b => b.onclick = () => basculer(b.dataset.vue));
  let minuterieRecherche;
  $('#recherche').oninput = e => {
    clearTimeout(minuterieRecherche);
    minuterieRecherche = setTimeout(() => { App.q = e.target.value; rendreBiblio(); }, 160);
  };
  $('#tri').onchange = e => { App.tri = e.target.value; rendreBiblio(); };
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    for (const id of ['#cuisine', '#panneau-ajout', '#panneau-recette']) {
      const p = $(id);
      if (!p.hidden) { p.hidden = true; rafraichir(); break; }
    }
  });

  rafraichir();
  await traiterPartage();

  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    try { await navigator.serviceWorker.register('sw.js'); } catch (e) { }
  }
}
window.ouvrirAjout = ouvrirAjout;
demarrer();
